<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CalcSuite logo">
  <defs>
    <!-- Background: deep slate with subtle depth -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <!-- Accent gradient: indigo -> emerald (left to right) -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#3B82F4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <!-- Soft top sheen for a premium feel -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Slate container -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Calculator keypad grid: 3 cols x 2 rows of soft buttons -->
    <!-- Cols at x=104,208,312 ; button 76x76, radius 18 -->
    <g fill="#E2E8F0">
      <rect x="104" y="96"  width="76" height="76" rx="18"/>
      <rect x="208" y="96"  width="76" height="76" rx="18"/>
      <rect x="312" y="96"  width="76" height="76" rx="18"/>
      <rect x="104" y="200" width="76" height="76" rx="18"/>
      <rect x="208" y="200" width="76" height="76" rx="18"/>
      <rect x="312" y="200" width="76" height="76" rx="18"/>
    </g>

    <!-- Rising growth bars: anchored to baseline y=380, ascend left->right -->
    <!-- Bar 1 aligns with keypad; bars 2 & 3 grow upward, peak ~row-2 top -->
    <g fill="url(#accent)">
      <rect x="104" y="304" width="76" height="76"  rx="18"/>
      <rect x="208" y="252" width="76" height="128" rx="18"/>
      <rect x="312" y="200" width="76" height="180" rx="18"/>
    </g>

    <!-- Top sheen overlay -->
    <rect width="512" height="512" fill="url(#sheen)"/>
  </g>

  <!-- Faint inner border for crispness on dark backgrounds -->
  <rect x="2" y="2" width="508" height="508" rx="111" ry="111"
        fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="2"/>
</svg>
